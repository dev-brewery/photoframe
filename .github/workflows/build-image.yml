name: Build Photoframe LITE image

on:
  push:
    tags:
      # Semver-shaped release tags only. Prevents ad-hoc v-prefixed tags
      # (vtest, vexperiment) from firing a ~5-minute release build.
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Photoframe tag to build (e.g. v3.0.0-rc1). Tag must already exist.'
        required: true
        type: string
      pi_gen_ref:
        description: 'dev-brewery/pi-gen ref (required — e.g. v3.0.0-rc1 for a reproducible build, or a branch/SHA for testing)'
        required: true
        type: string

permissions:
  contents: write

# Serialize builds per tag — release artifacts are valuable, don't cancel
# in-flight builds when a re-dispatch happens for the same tag.
concurrency:
  group: build-image-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PHOTOFRAME_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # On tag push, pi-gen is checked out at the matching tag (pi-gen
      # tag names mirror photoframe tag names — see dev-brewery/pi-gen's
      # RELEASE.md). On workflow_dispatch, the user supplies pi_gen_ref
      # explicitly; no silent fallback to a branch.
      PI_GEN_REF: ${{ github.event.inputs.pi_gen_ref || github.ref_name }}

    steps:
      # `required: true` on workflow_dispatch inputs rejects omission at
      # the UI/CLI layer but accepts empty strings. Without this guard,
      # `gh workflow run ... -f pi_gen_ref=""` falls through to the
      # `|| github.ref_name` fallback on line 39 and silently builds
      # against whatever branch the dispatch was triggered from.
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::tag is required on workflow_dispatch — no default, no empty-string fallback"
            exit 1
          fi
          if [ -z "${{ inputs.pi_gen_ref }}" ]; then
            echo "::error::pi_gen_ref is required on workflow_dispatch — no default, no empty-string fallback"
            exit 1
          fi

      # Fail fast if the paired pi-gen ref is missing. Without this,
      # the error surfaces ~60s later at the pi-gen checkout step,
      # after QEMU setup and photoframe checkout have run. `gh api
      # commits/<ref>` accepts tags, branches, and SHAs.
      - name: Verify pi-gen ref exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/dev-brewery/pi-gen/commits/${PI_GEN_REF}" --silent 2>/dev/null; then
            echo "::error::dev-brewery/pi-gen has no ref '${PI_GEN_REF}'. On tag push the pi-gen tag name mirrors the photoframe tag — cut the paired pi-gen tag first (see pi-gen's RELEASE.md)."
            exit 1
          fi

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      # Register qemu-user-static handlers in the host kernel's binfmt_misc
      # so pi-gen's build.sh can execute the armhf rootfs binaries under
      # emulation. pi-gen's in-container `dpkg-reconfigure qemu-user-static`
      # does not reliably set up the handlers on stock ubuntu-latest; doing
      # it here on the host is the standard Actions pattern.
      - name: Register QEMU binfmt handlers (armhf/arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Check out photoframe at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PHOTOFRAME_TAG }}
          path: photoframe

      - name: Check out dev-brewery/pi-gen
        uses: actions/checkout@v4
        with:
          repository: dev-brewery/pi-gen
          ref: ${{ env.PI_GEN_REF }}
          path: pi-gen

      - name: Write pi-gen config
        working-directory: pi-gen
        run: |
          cp config.example config
          cat >> config <<EOF

          # --- Injected by photoframe CI ---
          # Use the checked-out tag as the source tree instead of cloning
          # the branch referenced by PHOTOFRAME_BRANCH over the network.
          PHOTOFRAME_SRC=${GITHUB_WORKSPACE}/photoframe
          IMG_NAME='photoframe-${PHOTOFRAME_TAG}'
          EOF
          echo "--- final config ---"
          cat config

      - name: Build LITE image
        working-directory: pi-gen
        run: ./build-docker.sh lite

      - name: List deploy output
        working-directory: pi-gen/deploy
        run: ls -lah

      # pi-gen's default DEPLOY_COMPRESSION=zip emits
      # image_YYYY-MM-DD-<IMG_NAME>-lite.zip (the build date is
      # prepended automatically). Pi Imager consumes .zip natively —
      # the archive holds a single YYYY-MM-DD-<IMG_NAME>-lite.img entry.
      # Pi-gen uses two distinct variables that both start with the
      # date: ARCHIVE_FILENAME='image_'+IMG_DATE+IMG_NAME for the outer
      # zip and IMG_FILENAME=IMG_DATE+IMG_NAME for the inner .img.
      # So ship what pi-gen produces.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoframe-image-${{ env.PHOTOFRAME_TAG }}
          path: pi-gen/deploy/image_*.zip
          retention-days: 14
          if-no-files-found: error

      - name: Attach image to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PHOTOFRAME_TAG }}
          prerelease: ${{ contains(env.PHOTOFRAME_TAG, '-rc') || contains(env.PHOTOFRAME_TAG, '-beta') || contains(env.PHOTOFRAME_TAG, '-alpha') }}
          files: |
            pi-gen/deploy/image_*.zip
            pi-gen/deploy/*.info
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
